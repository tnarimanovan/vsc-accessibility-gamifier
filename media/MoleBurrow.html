<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole's Burrow — Dashboard</title>
    <style>
        :root {
            --mb-bg: var(--vscode-editor-background, #1e1e1e);
            --mb-fg: var(--vscode-editor-foreground, #d4d4d4);
            --mb-card-bg: rgba(255, 255, 255, 0.04);
            --mb-border: rgba(255, 255, 255, 0.08);
            --mb-accent: var(--vscode-textLink-foreground, #3794ff);
            --mb-descr: var(--vscode-descriptionForeground, #858585);

            /* Semantic Status Colors */
            --mb-success: #4caf50;
            --mb-error: #f44336;
            --mb-terminal-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: var(--vscode-font-family, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            font-size: var(--vscode-font-size, 13px);
            padding: 2rem 1.5rem;
            margin: 0;
            display: flex;
            justify-content: center;
            background-color: var(--mb-bg);
            color: var(--mb-fg);
        }

        .mole-app {
            width: 100%;
            max-width: 500px;
            background: var(--mb-card-bg);
            border: 1px solid var(--mb-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }

        .mole-app--active {
            opacity: 1;
        }

        .mole-app__header {
            text-align: center;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mole-app__stage {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--mb-accent);
            font-weight: 600;
            margin: 0 0 0.25rem 0;
        }

        .mole-app__level {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0;
        }

        .mole-app__toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--mb-border);
            color: var(--mb-descr);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: inherit;
            cursor: pointer;
            margin-top: 0.85rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .mole-app__toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--mb-fg);
            border-color: var(--mb-accent);
        }

        .mole-app__toggle-btn--active {
            background: rgba(55, 148, 255, 0.12);
            color: var(--mb-accent);
            border-color: var(--mb-accent);
        }

        .mole-app__avatar-ctx {
            width: 320px;
            height: 320px;
            margin: 0 auto 1.5rem auto;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .mole-app__img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            will-change: transform, opacity;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease-in-out;
            opacity: 1;
        }

        .mole-app__avatar-ctx--evolution .mole-app__img {
            transform: scale(1.15);
            filter: brightness(1.25) drop-shadow(0 0 20px var(--mb-accent));
        }

        .mole-app__avatar-ctx--transition .mole-app__img {
            opacity: 0.1;
            transform: scale(0.95);
        }

        .mole-app__avatar-ctx:hover .mole-app__img {
            transform: scale(1.04);
        }

        .mole-metric {
            margin-bottom: 1rem;
        }

        .mole-metric__label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: 0.5px;
            color: var(--mb-descr);
        }

        .mole-metric__track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            height: 6px;
            width: 100%;
        }

        .mole-metric__bar {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mole-metric__bar--xp {
            background: #3a86ff;
        }

        .mole-metric__bar--satiety {
            background: var(--mb-success);
        }

        .mole-terminal {
            background: var(--mb-terminal-bg);
            border-radius: 8px;
            padding: 1rem;
            font-family: var(--vscode-editor-font-family, monospace);
            font-size: 0.75rem;
            line-height: 1.6;
            border: 1px solid var(--mb-border);
            margin-top: 1.5rem;
        }

        .mole-terminal__line {
            display: block;
            word-break: break-all;
        }

        .mole-terminal__line--prefix {
            color: #569cd6;
        }

        .mole-diagnostics {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mole-diagnostics__card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--mb-error);
            border-radius: 4px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mole-diagnostics__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .mole-diagnostics__line {
            color: var(--mb-error);
        }

        .mole-diagnostics__rule {
            background: rgba(244, 67, 54, 0.15);
            color: #ff8a80;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.68rem;
        }

        .mole-diagnostics__msg {
            color: var(--mb-fg);
            font-size: 0.72rem;
            line-height: 1.4;
            white-space: pre-line;
        }

        .mole-diagnostics__link {
            color: var(--mb-accent);
            text-decoration: none;
            font-size: 0.68rem;
            align-self: flex-end;
            margin-top: 2px;
        }

        .mole-diagnostics__link:hover {
            text-decoration: underline;
        }

        .mole-diagnostics__item {
            color: #ffaa00;
            display: flex;
            gap: 6px;
            font-family: var(--vscode-editor-font-family, monospace);
            margin-bottom: 0.2rem;
        }

        .export-section {
            margin-top: 24px;
            padding: 16px;
            background-color: var(--vscode-sideBar-background);
            border-top: 1px solid var(--vscode-widget-border);
            text-align: center;
        }

        .btn-export {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-export:hover {
            background-color: var(--vscode-button-hoverBackground);
        }

        .export-hint {
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
            margin-top: 8px;
            line-height: 1.3;
            }
    </style>
</head>

<body>

    <main id="app-container" class="mole-app" aria-label="Mole Accessibility Companion Dashboard">
        <header class="mole-app__header">
            <p id="view-stage" class="mole-app__stage">Connecting...</p>
            <h1 id="view-level" class="mole-app__level">Level 0</h1>
            <button id="toggle-highlight-btn" class="mole-app__toggle-btn mole-app__toggle-btn--active">
                HIGHLIGHTS: ON
            </button>
        </header>

        <div id="avatar-container" class="mole-app__avatar-ctx">
            <img id="view-avatar" class="mole-app__img" src="" alt="Mole Companion Profile">
        </div>

        <section class="mole-metric" aria-label="Experience Points">
            <div class="mole-metric__label">
                <span>EXPERIENCE</span>
                <span id="view-xp-text">0 / 0 XP</span>
            </div>
            <div class="mole-metric__track">
                <div id="view-xp-bar" class="mole-metric__bar mole-metric__bar--xp" role="progressbar" aria-valuemin="0"
                    aria-valuemax="100" aria-valuenow="0"></div>
            </div>
        </section>

        <section class="mole-metric" aria-label="Satiety Level">
            <div class="mole-metric__label">
                <span>SATIETY</span>
                <span id="view-satiety-text">0%</span>
            </div>
            <div class="mole-metric__track">
                <div id="view-satiety-bar" class="mole-metric__bar mole-metric__bar--satiety" role="progressbar"
                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
        </section>

        <article id="view-terminal" class="mole-terminal" role="status" aria-live="polite">
            <span class="mole-terminal__line">
                <span class="mole-terminal__line--prefix">mole@burrow:~$</span>
                <span id="terminal-cmd">initializing...</span>
            </span>
            <span id="terminal-log" class="mole-terminal__line">> Waiting for diagnostics pipeline...</span>
            <div id="live-bug-list" class="mole-diagnostics" style="display: none;"></div>
        </article>
        <div class="export-section">
            <button id="export-report-btn" class="btn-export">
                📥 Export & Save Study Report (.json)
            </button>
            <p class="export-hint">
                Click to download your session results and attach the file to the post-study questionnaire.
            </p>
        </div>
    </main>

    <script>
        (function () {
            const vscode = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;

            const nodes = {
                app: document.getElementById('app-container'),
                stage: document.getElementById('view-stage'),
                level: document.getElementById('view-level'),
                avatar: document.getElementById('view-avatar'),
                avatarCtx: document.getElementById('avatar-container'),
                xpText: document.getElementById('view-xp-text'),
                xpBar: document.getElementById('view-xp-bar'),
                satietyText: document.getElementById('view-satiety-text'),
                satietyBar: document.getElementById('view-satiety-bar'),
                toggleBtn: document.getElementById('toggle-highlight-btn'),
                termCmd: document.getElementById('terminal-cmd'),
                termLog: document.getElementById('terminal-log'),
                bugContainer: document.getElementById('live-bug-list')
            };

            const STAGE_NAMES = {
                1: 'Mole Intern',
                2: 'Junior Mole Dev',
                3: 'Senior Mole Dev',
                4: 'Accessibility Architect'
            };

            let previousErrorCount = 0;
            let isHighlightEnabled = true;
            let currentCachedDiagnostics = null;
            let currentAssetSrc = '';

            nodes.toggleBtn.addEventListener('click', () => {
                isHighlightEnabled = !isHighlightEnabled;
                updateToggleButtonUI();

                if (vscode) {
                    vscode.postMessage({
                        type: 'TOGGLE_HIGHLIGHTING',
                        payload: { enabled: isHighlightEnabled }
                    });
                }
            });

            function updateToggleButtonUI() {
                if (isHighlightEnabled) {
                    nodes.toggleBtn.classList.add('mole-app__toggle-btn--active');
                    nodes.toggleBtn.textContent = 'HIGHLIGHTS: ON';
                } else {
                    nodes.toggleBtn.classList.remove('mole-app__toggle-btn--active');
                    nodes.toggleBtn.textContent = 'HIGHLIGHTS: OFF';
                }
            }

            function render(state) {
                if (!state) return;

                nodes.app.classList.add('mole-app--active');

                // 1. DOM Text Updates
                const targetLevelText = `Level ${state.level || 1}`;
                if (nodes.level.textContent !== targetLevelText) {
                    nodes.level.textContent = targetLevelText;
                }

                const targetStageName = STAGE_NAMES[state.stage] || STAGE_NAMES[1];
                if (nodes.stage.textContent !== targetStageName) {
                    nodes.stage.textContent = targetStageName;
                }

                // 2. XP Progress Math
                const currentXp = state.xp || 0;
                const maxXp = state.neededXp || 100;
                const xpPercentage = Math.min(100, (currentXp / maxXp) * 100);

                nodes.xpText.textContent = `${currentXp} / ${maxXp} XP`;
                nodes.xpBar.style.width = `${xpPercentage}%`;
                nodes.xpBar.setAttribute('aria-valuenow', Math.round(xpPercentage));

                // 3. Satiety Progress Math
                const satiety = state.satiety ?? 100;
                nodes.satietyText.textContent = `${satiety}%`;
                nodes.satietyBar.style.width = `${satiety}%`;
                nodes.satietyBar.setAttribute('aria-valuenow', satiety);

                // 4. Companion Asset Resolvers
                if (window.MOLE_ASSETS) {
                    let assetKey = 'bored';
                    let altDesc = 'Your Mole companion rests peacefully in a clean, accessible burrow.';

                    let cmdText = `test --file ${state.fileName}`;
                    let logText = `> [SUCCESS] 100% WCAG criteria met. Code is fully edible!`;
                    let logColor = 'var(--mb-success)';

                    if (state.errorCount > 0) {
                        assetKey = 'thinking';
                        altDesc = `Your Mole companion looking confused because ${state.errorCount} accessibility bugs were detected.`;
                        cmdText = `err --file ${state.fileName}`;
                        logText = `> [WARNING] ${state.errorCount} bugs left. Mole is contemplating...`;
                        logColor = '#ffaa00';

                        if (state.errorCount < previousErrorCount) {
                            assetKey = 'digging';
                            altDesc = `Your Mole companion is digging intensely, helping you clear out the remaining ${state.errorCount} bugs.`;
                            cmdText = `progress --fix`;
                            logText = `> [DIGGING] Keep going! Errors decreased to ${state.errorCount}.`;
                            logColor = 'var(--mb-success)';
                        }
                        else if (state.errorCount >= 3) {
                            assetKey = 'handsUp';
                            altDesc = `Your Mole companion threw its hands up in despair due to ${state.errorCount} critical accessibility errors.`;
                            cmdText = `err --file ${state.fileName}`;
                            logText = `> [CRITICAL] Found ${state.errorCount} accessibility violations.\n> Refusing to digest dirty markup.`;
                            logColor = 'var(--mb-error)';
                        }

                        nodes.bugContainer.style.display = 'flex';
                    } else {
                        assetKey = 'bored';
                        altDesc = 'Your Mole companion rests peacefully in a clean, accessible burrow.';

                        if (state.stage >= 3) {
                            assetKey = 'outsideHappy';
                            altDesc = 'Your experienced Senior Mole proudly wearing an engineer helmet and holding a flashlight.';
                        } else if (state.stage === 2) {
                            assetKey = 'outsideHelmet';
                            altDesc = 'Your Junior Mole developer wearing a hard hat, happy with your code changes.';
                        }

                        nodes.bugContainer.style.display = 'none';
                        nodes.bugContainer.innerHTML = '';
                    }

                    nodes.termCmd.textContent = cmdText;
                    nodes.termLog.textContent = logText;
                    nodes.termLog.style.color = logColor;

                    if (state.errorCount > 0 && currentCachedDiagnostics) {
                        renderDiagnostics(currentCachedDiagnostics);
                    }

                    // Resolve final URI paths
                    const currentStageKey = state.stage || 1;
                    let targetSrc = '';

                    if (window.MOLE_ASSETS[currentStageKey] && window.MOLE_ASSETS[currentStageKey][assetKey]) {
                        targetSrc = window.MOLE_ASSETS[currentStageKey][assetKey];
                    } else if (window.MOLE_ASSETS[1] && window.MOLE_ASSETS[1]['bored']) {
                        targetSrc = window.MOLE_ASSETS[1]['bored'];
                    }

                    if (currentAssetSrc !== targetSrc) {
                        currentAssetSrc = targetSrc;

                        if (messagePayload && messagePayload.eventType === 'LEVEL_UP') {
                            nodes.avatarCtx.classList.add('mole-app__avatar-ctx--evolution');
                            nodes.avatar.src = targetSrc;
                            setTimeout(() => {
                                nodes.avatarCtx.classList.remove('mole-app__avatar-ctx--evolution');
                            }, 600);
                        } else {
                            nodes.avatarCtx.classList.add('mole-app__avatar-ctx--transition');
                            setTimeout(() => {
                                nodes.avatar.src = targetSrc;
                                nodes.avatarCtx.classList.remove('mole-app__avatar-ctx--transition');
                            }, 180);
                        }
                    }

                    nodes.avatar.alt = altDesc;
                    previousErrorCount = state.errorCount;
                }
            }

            function renderDiagnostics(payload) {
                currentCachedDiagnostics = payload;
                if (!nodes.bugContainer || nodes.bugContainer.style.display === 'none') return;

                const details = payload.errorDetails || [];
                const lines = payload.errorLines || [];

                if (details.length > 0) {
                    let innerHTML = '';
                    details.forEach((err) => {
                        const humanRowNumber = err.line + 1;
                        const linkHtml = err.helpUrl
                            ? `<a class="mole-diagnostics__link" href="${err.helpUrl}" target="_blank">Docs ›</a>`
                            : '';

                        innerHTML += `
                            <div class="mole-diagnostics__card">
                                <div class="mole-diagnostics__header">
                                    <span class="mole-diagnostics__line">🔴 Line ${humanRowNumber}</span>
                                    <span class="mole-diagnostics__rule">${err.ruleId}</span>
                                </div>
                                <div class="mole-diagnostics__msg">${err.message}</div>
                                ${linkHtml}
                            </div>
                        `;
                    });
                    nodes.bugContainer.innerHTML = innerHTML;
                    return;
                }

                if (lines.length > 0) {
                    let innerHTML = '';
                    lines.forEach(lineIndex => {
                        const humanRowNumber = lineIndex + 1;
                        innerHTML += `<span class="mole-diagnostics__item"> └─ 🔴 Line ${humanRowNumber}: Accessibility fix required</span>`;
                    });
                    nodes.bugContainer.innerHTML = innerHTML;
                } else {
                    nodes.bugContainer.innerHTML = '';
                }
            }

            let messagePayload = null;

            // Initialize System Event Bridge Router
            window.addEventListener('message', (event) => {
                const message = event.data;
                if (!message) return;

                if (message.type === 'STATE_UPDATE') {
                    if (message.payload && message.payload.state) {
                        messagePayload = message.payload;
                        render(message.payload.state);
                    }
                }
                else if (message.type === 'DIAGNOSTICS_UPDATE') {
                    renderDiagnostics(message.payload);
                }
            });

            window.addEventListener('DOMContentLoaded', () => {
                if (vscode) {
                    vscode.postMessage({ type: 'UI_READY' });
                }
            });

            const exportBtn = document.getElementById('export-report-btn');
            if (exportBtn) {
                exportBtn.addEventListener('click', () => {
                    if (vscode) {
                        vscode.postMessage({ command: 'exportReport' });
                    } else {
                        console.warn('VS Code API not detected. Export report triggered locally.');
                    }
                });
            }
        })();
    </script>
</body>

</html>
