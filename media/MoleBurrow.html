<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mole's Burrow — Dashboard</title>
    <style>
        :root {
            --mb-bg: var(--vscode-editor-background, #1e1e1e);
            --mb-fg: var(--vscode-editor-foreground, #d4d4d4);
            --mb-card-bg: rgba(255, 255, 255, 0.04);
            --mb-border: rgba(255, 255, 255, 0.08);
            --mb-accent: var(--vscode-textLink-foreground, #3794ff);
            --mb-descr: var(--vscode-descriptionForeground, #858585);

            /* Semantic Status Colors */
            --mb-success: #4caf50;
            --mb-error: #f44336;
            --mb-terminal-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: var(--vscode-font-family, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
            font-size: var(--vscode-font-size, 13px);
            padding: 2rem 1.5rem;
            margin: 0;
            display: flex;
            justify-content: center;
            background-color: var(--mb-bg);
            color: var(--mb-fg);
        }

        .mole-app {
            width: 100%;
            max-width: 500px;
            background: var(--mb-card-bg);
            border: 1px solid var(--mb-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
        }

        .mole-app__header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .mole-app__stage {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--mb-accent);
            font-weight: 600;
            margin: 0 0 0.25rem 0;
        }

        .mole-app__level {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0;
        }

        .mole-app__avatar-ctx {
            width: 400px;
            height: 400px;
            margin: 0 auto 1.5rem auto;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mole-app__img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            will-change: transform;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mole-app__avatar-ctx:hover .mole-app__img {
            transform: scale(1.03);
        }

        .mole-metric {
            margin-bottom: 1rem;
        }

        .mole-metric__label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: 0.5px;
            color: var(--mb-descr);
        }

        .mole-metric__track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            height: 6px;
            width: 100%;
        }

        .mole-metric__bar {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mole-metric__bar--xp {
            background: #3a86ff;
        }

        .mole-metric__bar--satiety {
            background: var(--mb-success);
        }

        .mole-terminal {
            background: var(--mb-terminal-bg);
            border-radius: 8px;
            padding: 1rem;
            font-family: var(--vscode-editor-font-family, monospace);
            font-size: 0.75rem;
            line-height: 1.6;
            border: 1px solid var(--mb-border);
            margin-top: 1.5rem;
        }

        .mole-terminal__line {
            display: block;
            word-break: break-all;
        }

        .mole-terminal__line--success {
            color: var(--mb-success);
        }

        .mole-terminal__line--error {
            color: var(--mb-error);
        }

        .mole-terminal__line--prefix {
            color: #569cd6;
        }
    </style>
</head>

<body>

    <main class="mole-app" aria-label="Mole Accessibility Companion Dashboard">
        <header class="mole-app__header">
            <p id="view-stage" class="mole-app__stage">Loading State...</p>
            <h1 id="view-level" class="mole-app__level">Level 0</h1>
        </header>

        <div class="mole-app__avatar-ctx">
            <img id="view-avatar" class="mole-app__img" src="" alt="Mole Companion Profile">
        </div>

        <section class="mole-metric" aria-label="Experience Points">
            <div class="mole-metric__label">
                <span>EXPERIENCE</span>
                <span id="view-xp-text">0 / 0 XP</span>
            </div>
            <div class="mole-metric__track">
                <div id="view-xp-bar" class="mole-metric__bar mole-metric__bar--xp" role="progressbar" aria-valuemin="0"
                    aria-valuemax="100" aria-valuenow="0"></div>
            </div>
        </section>

        <section class="mole-metric" aria-label="Satiety Level">
            <div class="mole-metric__label">
                <span>SATIETY</span>
                <span id="view-satiety-text">0%</span>
            </div>
            <div class="mole-metric__track">
                <div id="view-satiety-bar" class="mole-metric__bar mole-metric__bar--satiety" role="progressbar"
                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
        </section>

        <article id="view-terminal" class="mole-terminal" role="status" aria-live="polite">
            <span class="mole-terminal__line"><span class="mole-terminal__line--prefix">mole@burrow:~$</span>
                initializing...</span>
        </article>
    </main>

    <script>
        (function () {
            // Core UI Nodes Map — Cached once for performance
            const nodes = {
                stage: document.getElementById('view-stage'),
                level: document.getElementById('view-level'),
                avatar: document.getElementById('view-avatar'),
                xpText: document.getElementById('view-xp-text'),
                xpBar: document.getElementById('view-xp-bar'),
                satietyText: document.getElementById('view-satiety-text'),
                satietyBar: document.getElementById('view-satiety-bar'),
                terminal: document.getElementById('view-terminal')
            };

            // Mappings for Clean Domain Separation
            const STAGE_NAMES = {
                1: 'Mole Intern',
                2: 'Junior Mole Dev',
                3: 'Senior Mole Dev',
                4: 'Accessibility Architect'
            };

            /**
             * State-Driven UI Render Engine (Single Responsibility Principle)
             */
            let previousErrorCount = 0;
            function render(state) {
                if (!state) return;

                // 1. Structural Text Updates
                nodes.level.textContent = `Level ${state.level || 1}`;
                nodes.stage.textContent = STAGE_NAMES[state.stage] || STAGE_NAMES[1];

                // 2. XP Metric Progress Math & ARIA mapping
                const currentXp = state.xp || 0;
                const maxXp = state.neededXp || 100;
                const xpPercentage = Math.min(100, (currentXp / maxXp) * 100);

                nodes.xpText.textContent = `${currentXp} / ${maxXp} XP`;
                nodes.xpBar.style.width = `${xpPercentage}%`;
                nodes.xpBar.setAttribute('aria-valuenow', Math.round(xpPercentage));

                // 3. Satiety Progress Math & ARIA mapping
                const satiety = state.satiety ?? 100;
                nodes.satietyText.textContent = `${satiety}%`;
                nodes.satietyBar.style.width = `${satiety}%`;
                nodes.satietyBar.setAttribute('aria-valuenow', satiety);

                // 4. Asset Pipeline & Accessibility Alt mappings
                if (window.MOLE_ASSETS && window.MOLE_ASSETS[state.stage]) {
                    let assetKey = 'bored';
                    let altDesc = 'Your Mole companion rests peacefully in a clean, accessible burrow.';
                    let terminalHtml = '';

                    if (state.errorCount > 0) {
                        assetKey = 'thinking';
                        altDesc = `Your Mole companion looking confused because ${state.errorCount} accessibility bugs were detected.`;
                        terminalHtml = `
                                <span class="mole-terminal__line"><span class="mole-terminal__line--prefix">mole@burrow:~$</span> err --file ${state.fileName}</span>
                                <span class="mole-terminal__line" style="color: #ffaa00;">> [WARNING] ${state.errorCount} bugs left. Mole is contemplating...</span>
                            `;

                        if (state.errorCount < previousErrorCount) {
                            assetKey = 'digging';
                            altDesc = `Your Mole companion is digging intensely, helping you clear out the remaining ${state.errorCount} bugs.`;
                            terminalHtml = `
                                    <span class="mole-terminal__line"><span class="mole-terminal__line--prefix">mole@burrow:~$</span> progress --fix</span>
                                    <span class="mole-terminal__line mole-terminal__line--success">> [DIGGING] Keep going! Errors decreased to ${state.errorCount}.</span>
                                `;
                        }
                        else if (state.errorCount >= 3) {
                            assetKey = 'handsUp';
                            altDesc = `Your Mole companion threw its hands up in despair due to ${state.errorCount} critical accessibility errors.`;
                            terminalHtml = `
                                    <span class="mole-terminal__line"><span class="mole-terminal__line--prefix">mole@burrow:~$</span> err --file ${state.fileName}</span>
                                    <span class="mole-terminal__line mole-terminal__line--error">> [CRITICAL] Found ${state.errorCount} accessibility violations.</span>
                                    <span class="mole-terminal__line" style="color: var(--mb-descr);">> Refusing to digest dirty markup.</span>
                                `;
                        }
                    } else {
                        // Success Matrix matching evolution rules (bored)
                        assetKey = 'bored';
                        altDesc = 'Your Mole companion rests peacefully in a clean, accessible burrow.';
                        terminalHtml = `
                                <span class="mole-terminal__line"><span class="mole-terminal__line--prefix">mole@burrow:~$</span> test --file ${state.fileName}</span>
                                <span class="mole-terminal__line mole-terminal__line--success">> [SUCCESS] 100% WCAG criteria met. Code is fully edible!</span>
                            `;
                    }

                    const targetStageAssets = window.MOLE_ASSETS[state.stage];
                    if (targetStageAssets && targetStageAssets[assetKey]) {
                        nodes.avatar.src = targetStageAssets[assetKey];
                    }

                    nodes.avatar.alt = altDesc;
                    nodes.terminal.innerHTML = terminalHtml;

                    previousErrorCount = state.errorCount;
                }
            }

            // Initialize System Event Bridge
            window.addEventListener('message', (event) => {
                const message = event.data;
                if (message?.type === 'updateState') {
                    render(message.data);
                }
            });

            // Initial fallback render pass
            render({
                level: 1,
                stage: 1,
                xp: 0,
                neededXp: 100,
                satiety: 100,
                errorCount: 0,
                fileName: 'none'
            });
        })();
    </script>
</body>

</html>
